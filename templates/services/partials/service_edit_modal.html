{% if edit_form and edit_service %}
<template x-teleport="body">
  <div
    class="inventory-create-modal-root luna-modal-root"
    x-cloak
    x-show="editOpen"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    role="presentation"
  >
    <button
      type="button"
      class="inventory-create-modal__backdrop" tabindex="-1"
      aria-label="بستن"
      @click="$dispatch('beautyos-close-edit-modal')"
    ></button>
    <div
      class="inventory-create-modal inventory-create-modal--wide luna-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="service-edit-modal-title" aria-describedby="service-edit-modal-title-description"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-3 sm:translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      @click.stop
    >
      <header class="inventory-create-modal__head">
        <div class="luna-modal-heading">
          <span class="luna-modal-emblem" aria-hidden="true"><i data-lucide="scissors"></i></span>
          <div class="luna-modal-heading__copy">
            <h2 id="service-edit-modal-title" class="inventory-create-modal__title" tabindex="-1">ویرایش خدمت</h2>
            <p id="service-edit-modal-title-description" class="luna-modal-subtitle">اطلاعات و تعرفه خدمت را به‌روزرسانی کنید.</p>
          </div>
        </div>
        <button
          type="button"
          class="inventory-create-modal__close"
          aria-label="بستن"
          @click="$dispatch('beautyos-close-edit-modal')"
        >
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </header>
      {% include "services/partials/service_edit_form.html" %}
    </div>
  </div>
</template>
{% endif %}
