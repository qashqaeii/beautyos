{% extends "public/booking/base_booking.html" %}
{% block booking_content %}
<div class="premium-card text-center">
  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-sage-soft text-sage">
    <i data-lucide="check" class="h-7 w-7"></i>
  </span>
  <h1 class="display-editorial mt-6 text-2xl font-semibold text-espresso">نوبت شما ثبت شد</h1>
  <p class="mt-3 text-sm text-ink-secondary">کد پیگیری:</p>
  <p class="mt-1 text-lg font-semibold tracking-wide text-espresso" dir="ltr">{{ appointment.tracking_code }}</p>
  <a href="{% url 'salons_public:landing' slug=salon.slug %}" class="btn-secondary mt-8 inline-flex">بازگشت به صفحه سالن</a>
</div>
{% endblock %}
