{% load static %}
<header class="overview-hero overview-hero--mgmt dashboard-enter">
  <div class="overview-hero__visual" aria-hidden="true">
    <img
      src="{% static 'images/photos/Lavender Glow Beauty Portrait.webp' %}"
      alt=""
      class="overview-hero__image overview-hero__image--mgmt"
      width="640"
      height="480"
      decoding="async"
      onerror="this.onerror=null;this.src='{% static 'images/dashboard/lavender_glow_beauty_portrait.png' %}';"
    >
    <div class="overview-hero__blend" aria-hidden="true"></div>
  </div>
  <div class="overview-hero__content">
    <div class="overview-hero__title-row">
      <h1 class="overview-hero__title">مدیریت سالن</h1>
      <span class="overview-hero__badge" aria-hidden="true"><i data-lucide="settings-2" class="h-[1.1rem] w-[1.1rem]"></i></span>
    </div>
    <p class="overview-hero__lead">دسترسی سریع به بخش‌های مدیریتی</p>
  </div>
</header>
