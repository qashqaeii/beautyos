{# Shared Jalali popover — Alpine: open, popoverStyle, viewJy, viewJm, birthPicker, monthsFaList, cells, pick, closeCalendar #}
<template x-teleport="{{ portal_target|default:'body' }}">
  <div
    x-ref="popover"
    class="jalali-date__popover jalali-date__popover--portal"
    :class="{ 'jalali-date__popover--birth': birthPicker, 'jalali-date__popover--compact': directNavigation }"
    :style="popoverStyle"
    x-effect="if (open) { const month = viewJm; const year = viewJy; $nextTick(() => positionPopover()); }"
    x-show="open"
    x-cloak
    role="dialog"
    aria-modal="true"
    aria-label="تقویم شمسی"
    @click.stop
    @keydown.escape.stop="closeCalendar()"
    dir="rtl"
  >
    <template x-if="true">
      <header
        class="jalali-date__popover-head"
        :class="{ 'jalali-date__popover-head--compact-nav': directNavigation }"
      >
        <button
          type="button"
          class="jalali-date__nav"
          @click.stop="prevMonth()"
          :disabled="directNavigation && !canMoveMonth(-1)"
          aria-label="ماه قبل"
        >
          <span class="jalali-date__nav-icon" aria-hidden="true">›</span>
        </button>
        <template x-if="directNavigation">
          <div class="jalali-date__period-pair">
            <select class="jalali-date__period-control" aria-label="انتخاب ماه" :value="viewJm" @change="setViewMonth(Number($event.target.value))">
              <template x-for="month in monthOptions" :key="month.value"><option :value="month.value" :disabled="month.disabled" :selected="month.value === viewJm" x-text="month.label"></option></template>
            </select>
            <div class="jalali-date__year-menu" x-data="{ expanded: false }" @click.outside="expanded = false" @keydown.escape.stop="if (expanded) { expanded = false; $refs.yearTrigger.focus(); } else { closeCalendar(); }">
              <button type="button" class="jalali-date__period-control jalali-date__year-trigger" x-ref="yearTrigger" aria-label="انتخاب سال" :aria-expanded="expanded" @click="expanded = !expanded; if (expanded) $nextTick(() => $refs.yearList.querySelector('[aria-current=true]')?.scrollIntoView({block:'center'}))">
                <span x-text="yearOptions.find(y => y.value === viewJy)?.label"></span><span aria-hidden="true">⌄</span>
              </button>
              <div class="jalali-date__year-list" x-ref="yearList" x-show="expanded" x-cloak>
                <template x-for="year in yearOptions" :key="year.value">
                  <button type="button" :aria-current="year.value === viewJy ? 'true' : null" :data-year="year.value" @click="setViewYear(year.value); expanded = false; $refs.yearTrigger.focus()" x-text="year.label"></button>
                </template>
              </div>
            </div>
          </div>
        </template>
        <template x-if="!directNavigation">
          <p class="jalali-date__month-label" x-text="monthLabelFa"></p>
        </template>
        <button
          type="button"
          class="jalali-date__nav"
          @click.stop="nextMonth()"
          :disabled="directNavigation && !canMoveMonth(1)"
          aria-label="ماه بعد"
        >
          <span class="jalali-date__nav-icon" aria-hidden="true">‹</span>
        </button>
      </header>
    </template>
    <div class="jalali-date__weekdays" aria-hidden="true">
      <template x-for="w in weekdays" :key="w"><span x-text="w"></span></template>
    </div>
    <div class="jalali-date__grid" role="grid">
      <template x-for="(cell, idx) in cells" :key="idx">
        <button
          type="button"
          role="gridcell"
          class="jalali-date__day"
          :class="{
            'jalali-date__day--muted': !cell.inMonth,
            'jalali-date__day--selected': cell.selected,
            'jalali-date__day--today': cell.today,
            'jalali-date__day--disabled': cell.disabled
          }"
          :disabled="!cell.inMonth || cell.disabled"
          :aria-label="cell.inMonth ? cell.label : null"
          :aria-current="cell.selected ? 'date' : false"
          :aria-selected="Boolean(cell.selected)"
          @click.stop="pick(cell)"
          x-text="cell.label"
        ></button>
      </template>
    </div>
    <footer class="jalali-date__popover-foot" >
      <button type="button" class="jalali-date__today-link" @click.stop="pickToday()">امروز</button>
      <button type="button" class="jalali-date__dismiss" @click.stop="closeCalendar()">بستن</button>
    </footer>
  </div>
</template>
