{% load static %}
<img
  src="{% static BEAUTYOS_SITE_LOGO %}?v={{ BEAUTYOS_ASSET_VERSION }}"
  alt="{{ BEAUTYOS_PRODUCT_NAME }}"
  class="{{ logo_class|default:'h-10 w-auto max-w-[11rem] object-contain' }}"
  decoding="async"
  {% if logo_width %}width="{{ logo_width }}"{% endif %}
  {% if logo_height %}height="{{ logo_height }}"{% endif %}
>
