<nav class="list-view-switch" role="group" aria-label="تغییر نمای فهرست">
  <a
    href="{% querystring view='card' page=None %}"
    class="list-view-switch__btn {% if view_mode == 'card' %}is-active{% endif %}"
    aria-label="نمای کارتی"
    title="نمای کارتی"
    {% if view_mode == 'card' %}aria-current="true"{% endif %}
  >
    <i data-lucide="layout-grid" class="list-view-switch__icon" aria-hidden="true"></i>
    <span class="sr-only">نمای کارتی</span>
  </a>
  <a
    href="{% querystring view='table' page=None %}"
    class="list-view-switch__btn {% if view_mode == 'table' %}is-active{% endif %}"
    aria-label="نمای جدولی"
    title="نمای جدولی"
    {% if view_mode == 'table' %}aria-current="true"{% endif %}
  >
    <i data-lucide="table" class="list-view-switch__icon" aria-hidden="true"></i>
    <span class="sr-only">نمای جدولی</span>
  </a>
</nav>
