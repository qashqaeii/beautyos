{% if href %}
<a href="{{ href }}" class="maison-kpi maison-kpi--compact maison-kpi--motion {% if variant == 'primary' or featured %}kpi-primary{% elif variant == 'positive' or sage %}kpi-positive{% else %}kpi-standard{% endif %} block no-underline">
{% else %}
<div class="maison-kpi maison-kpi--compact maison-kpi--motion {% if variant == 'primary' or featured %}kpi-primary{% elif variant == 'positive' or sage %}kpi-positive{% else %}kpi-standard{% endif %}">
{% endif %}
  <div class="flex items-start justify-between gap-1.5">
    <div class="min-w-0 flex-1">
      <p class="kpi-label">{{ label }}</p>
      {% if suffix %}
      <p class="kpi-value-line mt-0.5"><span class="kpi-value">{{ value }}</span><span class="kpi-suffix-inline">{{ suffix }}</span></p>
      {% else %}
      <p class="kpi-value mt-0.5">{{ value }}</p>
      {% endif %}
      {% if hint %}<p class="kpi-hint">{{ hint }}</p>{% endif %}
    </div>
    {% if icon %}
    <span class="maison-kpi__icon {% if variant == 'primary' or featured %}maison-kpi__icon--accent{% else %}maison-kpi__icon--plain{% endif %}">
      <i data-lucide="{{ icon }}" class="{% if variant == 'primary' or featured %}h-4 w-4{% else %}h-3.5 w-3.5{% endif %}"></i>
    </span>
    {% endif %}
  </div>
{% if href %}
</a>
{% else %}
</div>
{% endif %}
