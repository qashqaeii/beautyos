{% load static format_tags %}
<header class="dash-page-header dash-page-header--overview dashboard-enter">
  <div class="dash-page-header__copy">
    <h1 class="dash-page-header__title">نمای کلی سالن</h1>
    <p class="dash-page-header__subtitle">{{ active_salon.name }}</p>
  </div>
  <div class="dash-page-header__dates">
    <a href="?day={{ prev_day }}{% if range_key %}&range={{ range_key }}{% endif %}" class="dash-page-header__nav" aria-label="روز قبل">‹</a>
    <form method="get" class="dash-page-header__jalali-form">
      {% if range_key %}<input type="hidden" name="range" value="{{ range_key }}">{% endif %}
      {% include "partials/jalali_day_field.html" with iso_day=selected_day|date:'Y-m-d' fallback_jalali=day_jalali %}
    </form>
    <a href="?day={{ next_day }}{% if range_key %}&range={{ range_key }}{% endif %}" class="dash-page-header__nav" aria-label="روز بعد">›</a>
  </div>
</header>
