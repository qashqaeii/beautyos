<header class="reception-desk-header dashboard-enter">
  <div class="reception-desk-header__bar">
    <div class="reception-desk-header__brand">
      <i data-lucide="concierge-bell" aria-hidden="true"></i>
      <h1 class="reception-desk-header__title">میز پذیرش</h1>
    </div>
    <div class="reception-desk-header__date" aria-label="انتخاب روز">
      <a href="{% url 'reception:desk' %}?day={{ prev_day }}{% if selected_service %}&amp;service={{ selected_service.pk }}{% endif %}{% if selected_slot_staff_id %}&amp;staff={{ selected_slot_staff_id }}{% endif %}" class="reception-desk-header__nav" aria-label="روز قبل"><i data-lucide="chevron-right" aria-hidden="true"></i></a>
      <form action="{% url 'reception:desk' %}" method="get" class="reception-desk-header__picker-form min-w-0">
        {% if selected_service %}<input type="hidden" name="service" value="{{ selected_service.pk }}">{% endif %}
        {% if selected_slot_staff_id %}<input type="hidden" name="staff" value="{{ selected_slot_staff_id }}">{% endif %}
        {% include "partials/jalali_day_field.html" with iso_day=selected_day|date:'Y-m-d' fallback_jalali=day_jalali|default:today_jalali %}
      </form>
      <a href="{% url 'reception:desk' %}?day={{ next_day }}{% if selected_service %}&amp;service={{ selected_service.pk }}{% endif %}{% if selected_slot_staff_id %}&amp;staff={{ selected_slot_staff_id }}{% endif %}" class="reception-desk-header__nav" aria-label="روز بعد"><i data-lucide="chevron-left" aria-hidden="true"></i></a>
    </div>
    {% if can_book_appointment %}
    <div class="reception-desk-header__actions">
      <a href="{% url 'reception:desk' %}?book=1&amp;day={{ selected_day|date:'Y-m-d' }}{% if selected_service %}&amp;service={{ selected_service.pk }}{% endif %}{% if selected_slot_staff_id %}&amp;staff={{ selected_slot_staff_id }}{% endif %}" class="btn-primary reception-desk-header__cta text-sm">
        <i data-lucide="plus" aria-hidden="true"></i> ثبت نوبت
      </a>
    </div>
    {% endif %}
  </div>
</header>
