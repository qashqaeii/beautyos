<template x-teleport="body">
  <div
    class="inventory-create-modal-root"
    x-cloak
    x-show="editOpen"
    x-transition.opacity
    role="presentation"
  >
    <button type="button" class="inventory-create-modal__backdrop" aria-label="بستن" @click="$dispatch('beautyos-close-modal')"></button>
    <div
      class="inventory-create-modal inventory-create-modal--wide"
      role="dialog"
      aria-modal="true"
      aria-labelledby="customer-edit-modal-title"
      @click.stop
    >
      <header class="inventory-create-modal__head">
        <h2 id="customer-edit-modal-title" class="inventory-create-modal__title">ویرایش مشتری</h2>
        <button type="button" class="inventory-create-modal__close" aria-label="بستن" @click="$dispatch('beautyos-close-modal')">
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </header>
      {% include "customers/partials/customer_edit_form.html" %}
    </div>
  </div>
</template>
