<template x-teleport="body">
  <div
    class="inventory-create-modal-root"
    x-cloak
    x-show="bookOpen"
    x-transition.opacity
    role="presentation"
  >
    <button type="button" class="inventory-create-modal__backdrop" aria-label="بستن" @click="$dispatch('beautyos-close-modal')"></button>
    <div
      class="inventory-create-modal inventory-create-modal--wide appointment-booking-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="appointment-booking-modal-title"
      @click.stop
    >
      <header class="inventory-create-modal__head inventory-create-modal__head--lavender">
        <h2 id="appointment-booking-modal-title" class="inventory-create-modal__title">رزرو نوبت</h2>
        <button type="button" class="inventory-create-modal__close" aria-label="بستن" @click="$dispatch('beautyos-close-modal')">
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </header>
      {% include "appointments/partials/appointment_booking_form.html" with appointment_form=appointment_form form_id=booking_form_id|default:"booking" %}
    </div>
  </div>
</template>
