{% load format_tags %}
<header class="appt-month-page-head dashboard-enter">
  <div class="editorial-calendar-heading">
    <span class="editorial-calendar-heading__icon" aria-hidden="true"><i data-lucide="calendar-days"></i></span>
    <div class="editorial-calendar-heading__copy">
      <h1 class="appt-month-page-head__title">تقویم {{ jalali_year|persian_digits }}</h1>
      <p>مدیریت نوبت‌ها و برنامه‌ریزی سالن</p>
    </div>
  </div>
  <div class="editorial-calendar-heading__actions">
    <span class="editorial-calendar-today"><i data-lucide="calendar" aria-hidden="true"></i><span>{{ calendar_today_label|persian_digits }}</span></span>
  </div>
</header>
