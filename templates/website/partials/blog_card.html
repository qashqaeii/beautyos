{% load static %}
<article class="pub3-blog-card">
  <a class="pub3-blog-card__media" href="{% url 'website:blog_post' slug=post.slug %}" aria-label="مطالعه مقاله {{ post.title }}">
    {% if post.cover_image %}
    <img src="{{ post.cover_image.url }}" alt="" class="pub3-blog-card__image" loading="lazy" decoding="async" width="800" height="500">
    {% else %}
    <div class="pub3-blog-card__fallback" aria-hidden="true"><i data-lucide="book-open-text"></i><span>مجله BeautyOS</span></div>
    {% endif %}
  </a>
  <div class="pub3-blog-card__body">
    {% if post.category %}<span class="pub3-blog-card__category">{{ post.category }}</span>{% endif %}
    <h3><a href="{% url 'website:blog_post' slug=post.slug %}">{{ post.title }}</a></h3>
    {% if post.summary %}<p>{{ post.summary|truncatechars:150 }}</p>{% endif %}
    <div class="pub3-blog-card__footer">
      {% if post.published_at %}<time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|fa_jalali }}</time>{% endif %}
      <a href="{% url 'website:blog_post' slug=post.slug %}" aria-label="ادامه مقاله {{ post.title }}"><i data-lucide="arrow-up-left" aria-hidden="true"></i></a>
    </div>
  </div>
</article>
