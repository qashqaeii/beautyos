<template x-teleport="body">
  <div class="inventory-create-modal-root" x-cloak x-show="timeoffOpen" x-transition.opacity role="presentation">
    <button type="button" class="inventory-create-modal__backdrop" aria-label="بستن" @click="$dispatch('beautyos-close-modal')"></button>
    <div
      class="inventory-create-modal staff-timeoff-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="staff-timeoff-modal-title"
      @click.stop
    >
      <header class="inventory-create-modal__head staff-timeoff-modal__head">
        <button
          type="button"
          class="inventory-create-modal__close staff-timeoff-modal__close"
          aria-label="بستن"
          @click="$dispatch('beautyos-close-modal')"
        >
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
        <div class="staff-timeoff-modal__titles">
          <h2 id="staff-timeoff-modal-title" class="inventory-create-modal__title">ثبت مرخصی</h2>
          <p class="staff-timeoff-modal__staff">{{ profile.display_name|default:profile.user }}</p>
        </div>
      </header>
      {% include "staff/partials/staff_time_off_form.html" %}
    </div>
  </div>
</template>
