# Development-only Compose (uses Django local settings). Never deploy as production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beautyos
      POSTGRES_USER: beautyos
      POSTGRES_PASSWORD: beautyos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beautyos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://beautyos:beautyos@db:5432/beautyos
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - beautyos_media:/app/media

volumes:
  beautyos_pg:
  beautyos_media:
